# RECRUIT.AI — Docker Compose for local development services
# Spins up MongoDB and Redis for the backend.
# Usage: docker-compose up -d

services:
  mongo:
    image: mongo:7
    container_name: recruit_ai_mongo
    environment:
      MONGO_INITDB_DATABASE: recruit_ai
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: recruit_ai_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongodata:
